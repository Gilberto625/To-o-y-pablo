<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaMya - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 4rem auto;
            background: var(--blanco);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: var(--negro);
            margin-bottom: 0.5rem;
        }

        .login-header .logo-text {
            font-size: 2rem;
            font-weight: 700;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <h1>pizza<span style="color: var(--rojo-primary);">M</span>ya</h1>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Menú</a></li>
            <li><a href="ordena.html">Ordena</a></li>
            <li><a href="mi-pedido.html">Mi pedido</a></li>
            <li><a href="combos.html">Combos</a></li>
        </ul>
    </nav>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-text">pizza<span style="color: var(--rojo-primary);">M</span>ya</div>
            <h1>Iniciar Sesión</h1>
            <p style="color: #666;">Ingresa a tu cuenta para continuar</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div style="text-align: right; margin-bottom: 1.5rem;">
                <a href="#" style="color: var(--naranja-primary); text-decoration: none; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Iniciar Sesión</button>

            <div class="divider">
                <span>o</span>
            </div>

            <p style="text-align: center; color: #666;">
                ¿No tienes cuenta?
                <a href="registro.html" style="color: var(--rojo-primary); text-decoration: none; font-weight: 600;">Regístrate aquí</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulación de inicio de sesión
            alert('Inicio de sesión exitoso');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
