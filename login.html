<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaMya - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        /* Sección izquierda - Imagen */
        .login-image-section {
            background: linear-gradient(135deg, rgba(255, 95, 6, 0.9), rgba(219, 27, 38, 0.9)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="%23FF5F06" width="800" height="600"/></svg>');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .pizza-emoji {
            font-size: 15rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .login-image-section h1 {
            font-size: 3rem;
            margin-top: 2rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .login-image-section p {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 1rem;
            opacity: 0.95;
        }

        /* Sección derecha - Formulario */
        .login-form-section {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-form-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        .form-header {
            margin-bottom: 3rem;
        }

        .form-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--negro);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: #666;
            font-size: 1rem;
        }

        .form-group-login {
            margin-bottom: 1.5rem;
        }

        .form-group-login label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--negro);
            font-size: 0.95rem;
        }

        .form-group-login input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8f8f8;
        }

        .form-group-login input::placeholder {
            color: #999;
        }

        .form-group-login input:focus {
            outline: none;
            border-color: var(--naranja-primary);
            background: white;
        }

        .btn-login-primary {
            width: 100%;
            padding: 1.2rem;
            background: var(--rojo-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login-primary:hover {
            background: #c11820;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(219, 27, 38, 0.4);
        }

        .btn-login-secondary {
            width: 100%;
            padding: 1rem;
            background: white;
            color: var(--rojo-primary);
            border: 2px solid var(--rojo-primary);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-login-secondary:hover {
            background: var(--rojo-primary);
            color: white;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }

        .forgot-password a {
            color: var(--naranja-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .divider-login {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider-login::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider-login span {
            background: white;
            padding: 0 1rem;
            color: #999;
            position: relative;
            z-index: 1;
        }

        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: #666;
        }

        .register-link a {
            color: var(--rojo-primary);
            text-decoration: none;
            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .terms-text {
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            margin-top: 2rem;
            line-height: 1.6;
        }

        .terms-text a {
            color: var(--naranja-primary);
            text-decoration: none;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .login-image-section {
                min-height: 40vh;
                padding: 2rem;
            }

            .pizza-emoji {
                font-size: 8rem;
            }

            .login-image-section h1 {
                font-size: 2rem;
            }

            .login-image-section p {
                font-size: 1rem;
            }

            .form-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Sección Izquierda - Imagen -->
        <div class="login-image-section">
            <div class="pizza-emoji">🍕</div>
            <h1>pizza<span style="color: #FFE66D;">M</span>ya</h1>
            <p>Las mejores pizzas a un click de distancia</p>
        </div>

        <!-- Sección Derecha - Formulario -->
        <div class="login-form-section">
            <div class="login-form-container">
                <div class="form-header">
                    <h2>Inicia Sesión</h2>
                    <p>Ingresa a tu cuenta para continuar</p>
                </div>

                <form id="loginForm">
                    <div class="form-group-login">
                        <label for="email">Dirección de correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Por ejemplo, nombre@ejemplo.com"
                            required
                        >
                    </div>

                    <div class="form-group-login">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                    </div>

                    <div class="forgot-password">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-login-primary">
                        Continuar
                    </button>

                    <button type="button" class="btn-login-secondary" onclick="continuarComoInvitado()">
                        Continuar Como Invitado
                    </button>

                    <div class="divider-login">
                        <span>o</span>
                    </div>

                    <div class="register-link">
                        ¿No tienes cuenta?
                        <a href="registro.html">Regístrate aquí</a>
                    </div>

                    <div class="terms-text">
                        Al registrarte, aceptas los
                        <a href="terminos.html">Términos y Condiciones</a>
                        y nuestra
                        <a href="politicas.html">Política de Privacidad</a>.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Guardar sesión simulada
            localStorage.setItem('usuarioLogueado', JSON.stringify({
                email: email,
                nombre: 'Usuario'
            }));

            alert('Inicio de sesión exitoso');
            window.location.href = 'index.html';
        });

        function continuarComoInvitado() {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
