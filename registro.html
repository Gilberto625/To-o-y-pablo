<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaMya - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .registro-container {
            max-width: 500px;
            margin: 4rem auto;
            background: var(--blanco);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .registro-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .registro-header h1 {
            color: var(--negro);
            margin-bottom: 0.5rem;
        }

        .registro-header .logo-text {
            font-size: 2rem;
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <h1>pizza<span style="color: var(--rojo-primary);">M</span>ya</h1>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Menú</a></li>
            <li><a href="ordena.html">Ordena</a></li>
            <li><a href="mi-pedido.html">Mi pedido</a></li>
            <li><a href="combos.html">Combos</a></li>
        </ul>
    </nav>

    <div class="registro-container">
        <div class="registro-header">
            <div class="logo-text">pizza<span style="color: var(--rojo-primary);">M</span>ya</div>
            <h1>Crear Cuenta</h1>
            <p style="color: #666;">Únete a nuestra familia pizzera</p>
        </div>

        <form id="registroForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="(555) 123-4567" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" required>
                    <span style="font-weight: normal; font-size: 0.9rem;">
                        Acepto los <a href="terminos.html" style="color: var(--naranja-primary);">términos y condiciones</a>
                        y las <a href="politicas.html" style="color: var(--naranja-primary);">políticas de privacidad</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Crear Cuenta</button>

            <p style="text-align: center; color: #666; margin-top: 1.5rem;">
                ¿Ya tienes cuenta?
                <a href="login.html" style="color: var(--rojo-primary); text-decoration: none; font-weight: 600;">Inicia sesión</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }

            // Simulación de registro exitoso
            alert('¡Registro exitoso! Bienvenido a PizzaMya');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
