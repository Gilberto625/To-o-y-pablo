<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaMya - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .registro-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        /* Sección izquierda - Imagen */
        .registro-image-section {
            background: linear-gradient(135deg, rgba(255, 95, 6, 0.9), rgba(219, 27, 38, 0.9)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="%23FF5F06" width="800" height="600"/></svg>');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .pizza-emoji {
            font-size: 15rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .registro-image-section h1 {
            font-size: 3rem;
            margin-top: 2rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .registro-image-section p {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 1rem;
            opacity: 0.95;
        }

        /* Sección derecha - Formulario */
        .registro-form-section {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .registro-form-container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .form-header {
            margin-bottom: 2.5rem;
        }

        .form-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--negro);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: #666;
            font-size: 1rem;
        }

        .form-group-registro {
            margin-bottom: 1.3rem;
        }

        .form-group-registro label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--negro);
            font-size: 0.9rem;
        }

        .form-group-registro input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: #f8f8f8;
        }

        .form-group-registro input::placeholder {
            color: #999;
        }

        .form-group-registro input:focus {
            outline: none;
            border-color: var(--naranja-primary);
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group-registro {
            display: flex;
            align-items: start;
            gap: 0.7rem;
            margin: 1.5rem 0;
        }

        .checkbox-group-registro input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .checkbox-group-registro label {
            font-weight: normal;
            cursor: pointer;
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        .checkbox-group-registro a {
            color: var(--naranja-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group-registro a:hover {
            text-decoration: underline;
        }

        .btn-registro-primary {
            width: 100%;
            padding: 1.2rem;
            background: var(--rojo-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 1rem;
        }

        .btn-registro-primary:hover {
            background: #c11820;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(219, 27, 38, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }

        .login-link a {
            color: var(--rojo-primary);
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .registro-wrapper {
                grid-template-columns: 1fr;
            }

            .registro-image-section {
                min-height: 35vh;
                padding: 2rem;
            }

            .pizza-emoji {
                font-size: 8rem;
            }

            .registro-image-section h1 {
                font-size: 2rem;
            }

            .registro-image-section p {
                font-size: 1rem;
            }

            .form-header h2 {
                font-size: 1.8rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="registro-wrapper">
        <!-- Sección Izquierda - Imagen -->
        <div class="registro-image-section">
            <div class="pizza-emoji">🍕</div>
            <h1>pizza<span style="color: #FFE66D;">M</span>ya</h1>
            <p>Únete a nuestra familia pizzera</p>
        </div>

        <!-- Sección Derecha - Formulario -->
        <div class="registro-form-section">
            <div class="registro-form-container">
                <div class="form-header">
                    <h2>Regístrate</h2>
                    <p>Crea tu cuenta en PizzaMya</p>
                </div>

                <form id="registroForm">
                    <div class="form-row">
                        <div class="form-group-registro">
                            <label for="nombre">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Juan"
                                required
                            >
                        </div>

                        <div class="form-group-registro">
                            <label for="apellido">Apellido</label>
                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                placeholder="Pérez"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group-registro">
                        <label for="email">Correo Electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Por ejemplo, nombre@ejemplo.com"
                            required
                        >
                    </div>

                    <div class="form-group-registro">
                        <label for="telefono">Teléfono</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="(555) 123-4567"
                            required
                        >
                    </div>

                    <div class="form-group-registro">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Mínimo 6 caracteres"
                            required
                            minlength="6"
                        >
                    </div>

                    <div class="form-group-registro">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repite tu contraseña"
                            required
                        >
                    </div>

                    <div class="checkbox-group-registro">
                        <input type="checkbox" id="terminos" required>
                        <label for="terminos">
                            Al registrarte, aceptas los
                            <a href="terminos.html">Términos y Condiciones</a>
                            y nuestra
                            <a href="politicas.html">Política de Privacidad</a>.
                        </label>
                    </div>

                    <button type="submit" class="btn-registro-primary">
                        Crear Cuenta
                    </button>

                    <div class="login-link">
                        ¿Ya tienes cuenta?
                        <a href="login.html">Inicia sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden');
                return;
            }

            if (password.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres');
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const email = document.getElementById('email').value;

            // Guardar usuario simulado
            localStorage.setItem('usuarioRegistrado', JSON.stringify({
                nombre: nombre + ' ' + apellido,
                email: email
            }));

            alert('¡Registro exitoso! Bienvenido a PizzaMya');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
