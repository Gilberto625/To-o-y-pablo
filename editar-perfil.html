<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaMya - Editar Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .editar-container {
            max-width: 700px;
            margin: 2rem auto;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .avatar-upload {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--naranja-primary), var(--rojo-primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 0 auto 1rem;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <h1>pizza<span style="color: var(--rojo-primary);">M</span>ya</h1>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Menú</a></li>
            <li><a href="ordena.html">Ordena</a></li>
            <li><a href="mi-pedido.html">Mi pedido</a></li>
            <li><a href="combos.html">Combos</a></li>
        </ul>
    </nav>

    <div class="editar-container">
        <div style="margin-bottom: 2rem;">
            <a href="perfil.html" style="color: var(--naranja-primary); text-decoration: none; font-weight: 600;">← Volver al Perfil</a>
        </div>

        <h1 style="text-align: center; margin-bottom: 2rem; color: var(--negro);">Editar Perfil</h1>

        <!-- Avatar Upload -->
        <div class="avatar-upload">
            <div class="avatar">👤</div>
            <button class="btn btn-outline" style="padding: 0.5rem 1.5rem;">Cambiar Foto</button>
        </div>

        <!-- Formulario de Edición -->
        <form id="editarPerfilForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="Juan" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" value="Pérez García" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" value="juan.perez@email.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" value="(555) 123-4567" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" value="Calle Principal #123, Col. Centro" required>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" value="Ciudad de México" required>
            </div>

            <div class="form-group">
                <label for="codigoPostal">Código Postal</label>
                <input type="text" id="codigoPostal" name="codigoPostal" value="12345" required>
            </div>

            <!-- Sección de Cambio de Contraseña -->
            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 2px solid #eee;">
                <h2 style="margin-bottom: 1.5rem; color: var(--negro); font-size: 1.3rem;">Cambiar Contraseña</h2>

                <div class="form-group">
                    <label for="passwordActual">Contraseña Actual</label>
                    <input type="password" id="passwordActual" name="passwordActual" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="passwordNueva">Nueva Contraseña</label>
                    <input type="password" id="passwordNueva" name="passwordNueva" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="passwordConfirmar">Confirmar Nueva Contraseña</label>
                    <input type="password" id="passwordConfirmar" name="passwordConfirmar" placeholder="••••••••">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1; padding: 1rem;">
                    Guardar Cambios
                </button>
                <button type="button" class="btn btn-outline" onclick="window.location.href='perfil.html'" style="flex: 1; padding: 1rem;">
                    Cancelar
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('editarPerfilForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const passwordNueva = document.getElementById('passwordNueva').value;
            const passwordConfirmar = document.getElementById('passwordConfirmar').value;

            // Validar contraseñas si se está intentando cambiar
            if (passwordNueva || passwordConfirmar) {
                if (passwordNueva !== passwordConfirmar) {
                    alert('Las contraseñas no coinciden');
                    return;
                }

                if (!document.getElementById('passwordActual').value) {
                    alert('Debes ingresar tu contraseña actual');
                    return;
                }
            }

            // Simulación de guardar cambios
            alert('Perfil actualizado exitosamente');
            window.location.href = 'perfil.html';
        });
    </script>
</body>
</html>
